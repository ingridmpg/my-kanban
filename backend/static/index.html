<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Trello</title>
  </head>
  <body>
    <h1>Hello world</h1>
    <p>API status: <span id="status">checking...</span></p>
    <script>
      fetch("/api/health")
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("status").textContent = data.status;
        });
    </script>
  </body>
</html>
